<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Daraz Recommender - AI Product Recommendations</title>
		<link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.1.3/css/bootstrap.min.css" integrity="sha384-MCw98/SFnGE8fJT3GXwEOngsV7Zt27NXFoaoApmYm81iuXoPkFOJwJ8ERdknLPMO" crossorigin="anonymous">
		<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.5.0/css/all.css" integrity="sha384-B4dIYHKNBt8Bc12p+WXckhzcICo0wtJAoU8YZTY5qE0Id1GSseTk6S+L3BlXeVIU" crossorigin="anonymous">
		<script src="https://ajax.googleapis.com/ajax/libs/jquery/3.3.1/jquery.min.js"></script>
		<link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='style.css')}}"/>
	</head>
	
	<body>
		<!-- Navigation Header -->
		<nav class="navbar navbar-dark daraz-navbar">
			<div class="navbar-container">
				<a class="navbar-brand" href="#">
					<i class="fas fa-shopping-bag"></i> Daraz Recommender
				</a>
				<span class="navbar-text">
					<i class="fas fa-bolt"></i> AI-Powered Recommendations
				</span>
			</div>
		</nav>

		<div class="container-fluid h-100">
			<div class="row justify-content-center h-100">		
				<div class="col-md-8 col-xl-6 chat">
					<div class="card daraz-card">
						<div class="card-header daraz-header msg_head">
							<div class="d-flex bd-highlight">
								<div class="img_cont">
									<img src="https://icon-library.com/images/shopping-icon-png/shopping-icon-png-13.jpg" class="rounded-circle user_img daraz-avatar">
									<span class="online_icon"></span>
								</div>
								<div class="user_info">
									<span class="daraz-title">Daraz Assistant</span>
									<p class="daraz-subtitle">Find perfect products for you</p>
								</div>
							</div>
						</div>
						<div id="messageFormeight" class="card-body msg_card_body daraz-chat-body">
							<div class="welcome-message">
								<h5><i class="fas fa-star"></i> Welcome to Daraz Recommender</h5>
								<p>Ask me about products, reviews, recommendations, and more!</p>
								<small>Examples:</small>
								<ul class="example-queries">
									<li>"What are the best smartphones?"</li>
									<li>"Show me budget laptops"</li>
									<li>"Recommend fashion items"</li>
								</ul>
							</div>
						</div>
						<div class="card-footer daraz-footer">
							<form id="messageArea" class="input-group daraz-input-group">
                                <input type="text" id="text" name="msg" placeholder="Ask about products, reviews, and recommendations..." autocomplete="off" class="form-control type_msg daraz-input" required/>
								<div class="input-group-append">
									<button type="submit" id="send" class="input-group-text send_btn daraz-send-btn"><i class="fas fa-paper-plane"></i></button>
								</div>
							</form>
						</div>
					</div>
				</div>
			</div>
		</div>
		
		<script>
			$(document).ready(function() {
				// Hide welcome message on first message
				let firstMessage = true;

				$("#messageArea").on("submit", function(event) {
					if (firstMessage) {
						$("#messageFormeight").html("");
						firstMessage = false;
					}

					const date = new Date();
					const hour = String(date.getHours()).padStart(2, '0');
					const minute = String(date.getMinutes()).padStart(2, '0');
					const str_time = hour + ":" + minute;
					var rawText = $("#text").val();

					var userHtml = '<div class="d-flex justify-content-end mb-3"><div class="msg_cotainer_send">' + escapeHtml(rawText) + '<span class="msg_time_send">'+ str_time + '</span></div><div class="img_cont_msg"><img src="https://ui-avatars.com/api/?name=User&background=FF6B35&color=fff" class="rounded-circle user_img_msg"></div></div>';
					
					$("#text").val("");
					$("#messageFormeight").append(userHtml);
					$("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);

					$.ajax({
						data: {
							msg: rawText,	
						},
						type: "POST",
						url: "/get",
					}).done(function(data) {
						var botHtml = '<div class="d-flex justify-content-start mb-3"><div class="img_cont_msg"><img src="https://ui-avatars.com/api/?name=Daraz&background=E31910&color=fff" class="rounded-circle user_img_msg"></div><div class="msg_cotainer">' + escapeHtml(data) + '<span class="msg_time">' + str_time + '</span></div></div>';
						$("#messageFormeight").append($.parseHTML(botHtml));
						$("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
					}).fail(function(error) {
						var errorHtml = '<div class="d-flex justify-content-start mb-3"><div class="img_cont_msg"><img src="https://ui-avatars.com/api/?name=Daraz&background=E31910&color=fff" class="rounded-circle user_img_msg"></div><div class="msg_cotainer msg_error">Sorry, I encountered an error. Please try again.</div></div>';
						$("#messageFormeight").append($.parseHTML(errorHtml));
						$("#messageFormeight").scrollTop($("#messageFormeight")[0].scrollHeight);
					});
					event.preventDefault();
				});

				// Escape HTML to prevent XSS
				function escapeHtml(text) {
					var map = {
						'&': '&amp;',
						'<': '&lt;',
						'>': '&gt;',
						'"': '&quot;',
						"'": '&#039;'
					};
					return text.replace(/[&<>"']/g, function(m) { return map[m]; });
				}
			});
		</script>
    </body>
</html>
